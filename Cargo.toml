[package]
name = "xiic-ssh-mcp"
version = "0.3.3"
edition = "2024"

[lib]
name = "xiic_ssh_mcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
getrandom = "0.3.4"
libc = "0.2.177"
rusqlite = { version = "0.37.0", features = ["bundled"] }
reqwest = { version = "0.12.26", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
